name: Publish OCI image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: docker/setup-buildx-action@v4
      - uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.74.0
          cache: true
      - name: Restore reusable BuildKit layers
        uses: actions/cache@v5
        with:
          path: .buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('examples/hello-api/Dockerfile', 'examples/hello-api/app.py', 'oci-secure.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ hashFiles('examples/hello-api/Dockerfile', 'examples/hello-api/app.py', 'oci-secure.toml') }}-
      - run: python -m pip install -e .
      - name: Build, scan, and verify the release candidate
        run: oci-secure pipeline --report reports/release-trivy.json
      - name: Create Kubernetes compatibility cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: oci-secure
      - name: Verify restricted Kubernetes runtime
        run: ./scripts/verify-kubernetes.sh
      - name: Resolve lowercase registry image name
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oci-secure-demo"
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact image that passed every gate
        env:
          REGISTRY_IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker tag oci-secure-demo:local "$REGISTRY_IMAGE:${GITHUB_REF_NAME}"
          docker tag oci-secure-demo:local "$REGISTRY_IMAGE:latest"
          docker push "$REGISTRY_IMAGE:${GITHUB_REF_NAME}"
          docker push "$REGISTRY_IMAGE:latest"
