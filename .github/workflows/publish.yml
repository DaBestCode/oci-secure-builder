name: Publish OCI image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.74.0
          cache: true
      - name: Build locally for policy gate
        uses: docker/build-push-action@v7
        with:
          context: examples/hello-api
          load: true
          tags: oci-secure-demo:release
          build-args: SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Block fixable high and critical CVEs
        run: trivy image --ignore-unfixed --exit-code 1 --severity HIGH,CRITICAL oci-secure-demo:release
      - name: Publish only after scan passes
        uses: docker/build-push-action@v7
        with:
          context: examples/hello-api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/oci-secure-demo:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/oci-secure-demo:latest
          build-args: SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
